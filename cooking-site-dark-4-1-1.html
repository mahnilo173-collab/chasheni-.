<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>چاشنی | دستور پخت خانگی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,700;1,700&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== رنگ‌ها و فونت‌ها: برای تغییر ظاهر فقط همین بخش را ویرایش کن ===== */
:root{--bg:#FAF6F0;--brand:#C0392B;--olive:#6B7C4A;--ink:#2C2416;--card:#FFFFFF;--accent:#E67E22;--mu:#6B6154;--ln:#EADFCF;--r:12px;
--sh:0 2px 10px rgba(44,36,22,.08);--sh2:0 12px 30px rgba(44,36,22,.18);
--fh:"Playfair Display",Vazirmatn,serif;--fb:Inter,Vazirmatn,Tahoma,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 var(--fb)}
h1,h2,h3{font-family:var(--fh);font-weight:700;line-height:1.35;margin:0 0 .4em}
h1{font-size:clamp(2rem,7vw,3.4rem)}h2{font-size:clamp(1.5rem,4.5vw,2.1rem)}h3{font-size:1.15rem}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
section{padding:36px 0}
.mt{color:var(--mu);font-size:.9rem;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 20px;border-radius:var(--r);border:1.5px solid var(--brand);background:var(--brand);color:#fff;font:600 1rem var(--fb);cursor:pointer}
.btn.o{background:none;color:var(--brand)}.btn.o[aria-pressed="true"]{background:var(--brand);color:#fff}
/* هدر و منو */
header{position:sticky;top:0;z-index:20;background:var(--card);box-shadow:var(--sh)}
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;min-height:60px}
.logo{font:700 1.4rem var(--fh);color:var(--brand)}
#tg{width:44px;height:44px;border:0;background:none;font-size:1.6rem;cursor:pointer;color:var(--ink)}
nav{width:100%}
nav ul{list-style:none;margin:0;padding:0;overflow:hidden;max-height:0;transition:max-height .3s}
nav.open ul{max-height:330px}
nav a{display:block;padding:12px 4px;min-height:44px;font-weight:600;border-top:1px solid var(--ln)}
@media(min-width:860px){#tg{display:none}nav{width:auto}nav ul{max-height:none;display:flex;gap:22px}nav a{border:0;padding:8px 0}}
nav a:hover{color:var(--brand)}
/* هیرو */
.hero{display:grid;gap:24px;align-items:center;padding:28px 0}
.hv{aspect-ratio:4/3;border-radius:var(--r);background:linear-gradient(135deg,#F1D3AE,#DDA574) center/cover;display:grid;place-items:center;font-size:6rem;box-shadow:var(--sh)}
@media(min-width:860px){.hero{grid-template-columns:1fr 1fr;gap:48px}}
/* گریدها و کارت‌ها */
.grid{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{display:block;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:box-shadow .25s,transform .25s}
.card:hover{box-shadow:var(--sh2);transform:translateY(-3px)}
.ph{aspect-ratio:4/3;overflow:hidden;background:linear-gradient(135deg,#F6E2C8,#E9BE93);display:grid;place-items:center;font-size:3.5rem}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .ph img,.card:hover .ph span{transform:scale(1.07)}.ph span{transition:transform .4s}
.cb{padding:14px 16px}
.cats{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.cats{grid-template-columns:repeat(6,1fr)}}
.ct{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);text-align:center;padding:18px 6px;font-weight:600;transition:box-shadow .25s}
.ct:hover{box-shadow:var(--sh2)}.ct b{display:block;font-size:2rem}
.row{display:flex;gap:14px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:10px;margin-bottom:12px;align-items:center}
.row .ph{width:84px;aspect-ratio:1;border-radius:10px;font-size:2rem;flex:none}
.row p{margin:0}
.about{display:grid;gap:20px;align-items:center;background:var(--olive);color:#fff;border-radius:var(--r);padding:28px}
.about .ph{width:140px;border-radius:50%;aspect-ratio:1;font-size:4rem;margin:auto}
@media(min-width:640px){.about{grid-template-columns:160px 1fr}}
.nl{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:28px;text-align:center}
.nl form{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
input[type=email],input[type=search],select{font:inherit;min-height:44px;padding:8px 14px;border:1.5px solid var(--ln);border-radius:var(--r);background:var(--card);color:var(--ink)}
input[type=email]{min-width:min(100%,280px)}
footer{background:var(--ink);color:#EADFCF;padding:32px 0 20px;margin-top:24px}
footer .fg{display:grid;gap:18px}@media(min-width:640px){footer .fg{grid-template-columns:repeat(3,1fr)}}
footer a{display:inline-block;padding:6px 0;margin-inline-end:12px}footer a:hover{color:#fff}
/* صفحه دستور */
.rh{aspect-ratio:16/9;max-height:420px;width:100%;border-radius:var(--r);overflow:hidden;background:linear-gradient(135deg,#F1D3AE,#DDA574);display:grid;place-items:center;font-size:7rem}
.rh img{width:100%;height:100%;object-fit:cover}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}
@media(min-width:640px){.info{grid-template-columns:repeat(4,1fr)}}
.info div{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:10px;text-align:center}
.info b{display:block;font-size:1.15rem;color:var(--brand)}
.bt{display:flex;flex-wrap:wrap;gap:10px}
.two{display:grid;gap:28px}@media(min-width:860px){.two{grid-template-columns:1fr 1.4fr}}
.sc{display:flex;gap:8px;margin-bottom:10px}
ul.ing{list-style:none;padding:0;margin:0}
.ing li{border-bottom:1px solid var(--ln)}
.ing label{display:flex;gap:12px;align-items:center;min-height:48px;cursor:pointer}
.ing input{width:22px;height:22px;accent-color:var(--olive)}
.ing input:checked+span{text-decoration:line-through;opacity:.55}
ol.st{list-style:none;padding:0;margin:0;counter-reset:s}
.st li{counter-increment:s;display:flex;gap:14px;margin-bottom:18px;font-size:1.05rem}
.st li:before{content:counter(s,persian);flex:none;width:36px;height:36px;border-radius:50%;background:var(--olive);color:#fff;display:grid;place-items:center;font-weight:600}
.tip{background:#FFF1E0;border-inline-start:5px solid var(--accent);border-radius:var(--r);padding:14px 18px;margin-top:8px}
.fl{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.chip{min-height:44px;padding:6px 16px;border-radius:999px;border:1.5px solid var(--ln);background:var(--card);font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
#up{position:fixed;left:16px;bottom:16px;width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:var(--sh2);opacity:0;pointer-events:none;transition:opacity .25s}
#up.on{opacity:1;pointer-events:auto}

/* ===== تم: شیشه‌ای + دارک لوکس + نئون ملایم =====
   رنگ‌ها را از همین بخش عوض کن (روی متغیرهای بالای فایل اولویت دارد) */
:root{--bg:#0A0A0F;--brand:#FF6B00;--pink:#FF006E;--olive:#FF006E;--ink:#FFFFFF;--card:rgba(255,255,255,.08);--accent:#FF6B00;--mu:#B0B0B0;--ln:rgba(255,255,255,.15);--r:20px;--success:#3DDC84;
/* نگاشت مستقیم توکن‌های طراحی درخواستی */
--primary:var(--brand);--secondary:var(--pink);--text:var(--ink);--surface:var(--card);
--sh:0 1px 2px rgba(0,0,0,.2),0 4px 8px rgba(0,0,0,.2),0 16px 32px rgba(0,0,0,.25);
--sh2:0 20px 40px rgba(0,0,0,.4),0 0 32px rgba(255,107,0,.35);
--grad:linear-gradient(135deg,#FF6B00,#FF006E);--bgimg:none;color-scheme:dark}
body::before{content:"";position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;
background-image:radial-gradient(circle at 15% 10%,rgba(255,107,0,.28),transparent 45%),radial-gradient(circle at 85% 70%,rgba(255,0,110,.22),transparent 45%),linear-gradient(rgba(10,10,15,.72),rgba(10,10,15,.88)),var(--bgimg),linear-gradient(160deg,#0A0A0F,#101426)}
header,.card,.ct,.row,.info div,.nl,.about,.tip,input[type=email],input[type=search],select,.chip{-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--ln)}
header{background:rgba(10,10,15,.6)}
.logo{text-shadow:0 0 18px rgba(255,107,0,.55)}
.chip,select,input{color:#fff}
::placeholder{color:#8A8A94}
option{background:#14141C;color:#fff}
.btn{background:var(--grad);color:#0A0A0F;border:0;box-shadow:0 4px 18px rgba(255,107,0,.35);transition:box-shadow .3s,transform .3s}
.btn:hover{box-shadow:0 6px 28px rgba(255,0,110,.55);transform:translateY(-2px)}
.btn.o{background:rgba(255,255,255,.06);color:#fff;border:1.5px solid rgba(255,107,0,.6);box-shadow:none}
.btn.o:hover{box-shadow:0 0 20px rgba(255,107,0,.4)}
.btn.o[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--grad);color:#0A0A0F;border-color:transparent}
.hv,.rh,.ph{background:linear-gradient(135deg,rgba(255,107,0,.22),rgba(255,0,110,.18)) center/cover}
.hv{box-shadow:0 0 60px rgba(255,107,0,.25),var(--sh)}
.card{transition:transform .4s cubic-bezier(.4,0,.2,1),box-shadow .4s cubic-bezier(.4,0,.2,1)}
.card:hover{transform:translateY(-8px);box-shadow:var(--sh2)}
.ct{transition:transform .4s cubic-bezier(.4,0,.2,1),box-shadow .4s}
.ct:hover{transform:translateY(-6px);box-shadow:var(--sh2)}
.about{background:linear-gradient(135deg,rgba(255,107,0,.18),rgba(255,0,110,.16));color:#fff}
.about .ph{border:1px solid var(--ln)}
.tip{background:rgba(255,107,0,.1);border-inline-start:5px solid var(--brand)}
.st li:before{background:var(--grad);color:#0A0A0F}
.ing input{accent-color:#FF6B00}
footer{background:rgba(255,255,255,.04);border-top:1px solid var(--ln);color:#B0B0B0}
footer h3{color:#fff}footer a:hover{color:#fff}
#up{background:var(--grad);color:#0A0A0F;box-shadow:0 0 20px rgba(255,107,0,.5)}
/* ===== انیمیشن ملایم هنگام اسکرول: fade-in + slide-up ===== */
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.rv{opacity:0}
.rv.in{opacity:1;animation:up .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){.rv{opacity:1}.rv.in{animation:none}}

/* ===== افزوده‌ها ===== */
.cats{grid-template-columns:repeat(3,1fr)}  /* موبایل */
@media(min-width:640px){.cats{grid-template-columns:repeat(6,1fr)}}
.hero h1{
  background:linear-gradient(90deg,#fff 0%,#FF6B00 50%,#fff 100%);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shimmer 3s linear infinite;
}
@keyframes shimmer{to{background-position:200% center}}
h2{position:relative;padding-bottom:12px}
h2::after{
  content:"";position:absolute;bottom:0;right:0;
  width:60px;height:4px;border-radius:2px;
  background:var(--grad);
  box-shadow:0 0 16px rgba(255,107,0,.6);
}
.nl h2::after{right:50%;transform:translateX(50%)}
.card{position:relative}
.card::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,10,15,.95) 0%,transparent 50%);
  pointer-events:none;
}
.badge{
  position:absolute;top:14px;right:14px;z-index:2;
  background:var(--grad);color:#0A0A0F;
  padding:5px 12px;border-radius:999px;
  font:600 12px var(--fb);
}
.card .cb{position:relative;z-index:2}
@media (prefers-reduced-motion:reduce){.hero h1{animation:none}}

/* ===== نسخه‌ی ۲: جزئیات ظاهری و انیمیشن‌ها ===== */
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,0,110,.6)}70%,100%{box-shadow:0 0 0 10px rgba(255,0,110,0)}}
@keyframes glowp{50%{box-shadow:0 4px 30px rgba(255,0,110,.7),0 0 26px rgba(255,107,0,.55)}}
html{scrollbar-color:#FF6B00 #0A0A0F}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#0A0A0F}
::-webkit-scrollbar-thumb{background:linear-gradient(#FF6B00,#FF006E);border-radius:8px}
::selection{background:#FF6B00;color:#0A0A0F}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .3s}
a:hover .ic,button:hover .ic,.info div:hover .ic{transform:scale(1.2)}
nav a{position:relative}
nav a::after{content:"";position:absolute;inset-inline:0;bottom:6px;height:2px;border-radius:2px;background:var(--grad);transform:scaleX(0);transition:transform .3s}
nav a:hover::after{transform:scaleX(1)}
input[type=email]:focus,input[type=search]:focus,select:focus{outline:0;border:1.5px solid transparent;background:linear-gradient(#14141C,#14141C) padding-box,var(--grad) border-box;box-shadow:0 0 16px rgba(255,107,0,.35)}
/* هیرو */
.hero h1{background-image:linear-gradient(90deg,#fff 0%,#FF6B00 25%,#FF006E 50%,#FF6B00 75%,#fff 100%);animation-duration:3s;filter:drop-shadow(0 0 18px rgba(255,107,0,.45))}
.hh{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.hh h1{margin:0}
.fe{display:inline-block;font-size:3rem;animation:float 4s ease-in-out infinite}
.hv{position:relative;overflow:hidden}
.hv::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,107,0,.3),rgba(255,0,110,.3))}
.hb{position:absolute;bottom:16px;inset-inline-start:16px;font:600 .9rem var(--fb);padding:6px 14px;border-radius:999px;background:rgba(10,10,15,.65);border:1px solid #FF6B00;color:#fff;box-shadow:0 0 18px rgba(255,107,0,.5)}
.hero .btn:not(.o),.nl .btn{animation:glowp 2.6s ease-in-out infinite}
.hero .bt{margin-top:18px}
/* کارت دستور */
.card{overflow:visible}
.card::before{content:"";position:absolute;inset:-2px;border-radius:inherit;background:var(--grad);filter:blur(14px);opacity:0;transition:opacity .4s;z-index:-1}
.card:hover::before{opacity:.55}
.card::after{border-radius:inherit}
.card:hover{transform:translateY(-12px);box-shadow:0 24px 48px rgba(0,0,0,.5),0 0 40px rgba(255,107,0,.4),0 0 64px rgba(255,0,110,.25)}
.card .ph{border-radius:var(--r) var(--r) 0 0}.card .cl{display:block}
.badge.e{background:#3DDC84}.badge.m{background:#FF6B00}
.badge.c{background:rgba(255,255,255,.12);color:#fff;border:1px solid var(--ln)}
.badge.s{position:static;display:inline-block}
.hrt{position:absolute;top:10px;left:10px;z-index:3;width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:rgba(10,10,15,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;cursor:pointer}
.hrt .ic{width:20px;height:20px}
.hrt[aria-pressed="true"]{color:#FF006E;border-color:#FF006E;box-shadow:0 0 16px rgba(255,0,110,.6)}
.hrt[aria-pressed="true"] .ic{fill:currentColor}
.badge{top:16px;right:16px}
.ib{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--mu);border-top:1px solid var(--ln);padding-top:10px;margin-top:10px}
.ib span{display:inline-flex;align-items:center;gap:5px}.ib .ic{color:var(--brand)}
/* دسته‌بندی‌ها */
.ct{position:relative;overflow:hidden;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:600}
.ct .ci{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.ct:hover .ci{transform:scale(1.12)}
.ct .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,15,.88),rgba(10,10,15,.45))}
.ct b,.ct span{position:relative;z-index:2;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.ct b{font-size:2.6rem;line-height:1.2;animation:float 3.6s ease-in-out infinite}
.ct:nth-child(2n) b{animation-delay:-1.2s}.ct:nth-child(3n) b{animation-delay:-2.4s}
.ct:hover{transform:scale(1.06);box-shadow:var(--sh2)}
/* آخرین دستورها */
.row{position:relative;gap:16px;padding:12px;transition:transform .4s cubic-bezier(.4,0,.2,1),box-shadow .4s}
.row .ph{width:min(38%,160px);aspect-ratio:4/3;border-radius:14px}
.row:hover{transform:translateX(-10px);box-shadow:var(--sh2)}
.new{position:absolute;top:12px;inset-inline-end:12px;z-index:2;background:var(--grad);color:#0A0A0F;font:600 .75rem var(--fb);padding:3px 12px;border-radius:999px;animation:pulse 2s infinite}
/* صفحه دستور */
.bd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:20px}
.stars{color:#FFC83D;letter-spacing:2px;text-shadow:0 0 12px rgba(255,200,61,.5)}
article h1::after{content:"";display:block;width:90px;height:5px;border-radius:3px;margin-top:12px;background:var(--grad);box-shadow:0 0 16px rgba(255,107,0,.6)}
.info .ic{width:26px;height:26px;color:var(--brand);display:block;margin:0 auto 4px}
.two h2::after{display:none}.two h2{padding:8px 16px;border-radius:12px}
.two>div:first-child h2{background:linear-gradient(90deg,#FF6B00,rgba(255,107,0,.35));color:#0A0A0F}
.two>div:last-child h2{background:linear-gradient(90deg,#FF006E,rgba(255,0,110,.35));color:#fff}
.tip{box-shadow:0 0 28px rgba(255,107,0,.2)}
/* خبرنامه و فوتر */
.nl{border-color:rgba(255,107,0,.45);box-shadow:0 0 40px rgba(255,107,0,.2),0 0 64px rgba(255,0,110,.14),var(--sh)}
.flogo{font:700 clamp(2rem,8vw,3rem) var(--fh);text-align:center;color:#fff;text-shadow:0 0 24px rgba(255,107,0,.85),0 0 48px rgba(255,0,110,.45)}
.fdiv{height:2px;border-radius:2px;background:var(--grad);box-shadow:0 0 18px rgba(255,107,0,.7);margin:18px 0 26px}
footer .fg>div>a{display:block}
.socs{display:flex;gap:10px;margin-top:12px}
.soc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ln);background:rgba(255,255,255,.06);color:#fff;margin:0!important;padding:0!important;transition:transform .3s,box-shadow .3s,border-color .3s}
.soc:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 0 20px rgba(255,107,0,.6)}
.soc .ic{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){.fe,.ct b,.new,.btn{animation:none!important}}

/* ===== لوگوی چاشنی ===== */
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.5rem}
.lg{width:44px;height:44px;border-radius:12px;box-shadow:0 0 16px rgba(255,107,0,.35)}
.flogo{display:grid;place-items:center}
.flogo img{width:min(260px,72%);height:auto;border-radius:28px;box-shadow:0 0 40px rgba(255,107,0,.3),0 0 70px rgba(255,0,110,.18)}

/* ===== جای لوگو ===== */
.hl{display:block;width:clamp(120px,34vw,170px);height:auto;border-radius:26px;margin-bottom:18px;box-shadow:0 0 36px rgba(255,107,0,.3),0 0 60px rgba(255,0,110,.18);animation:float 5s ease-in-out infinite}
.lg{width:48px;height:48px}
.logo{font-size:1.6rem}
@media (prefers-reduced-motion:reduce){.hl{animation:none}}

/* ===== دستیار هوشمند ===== */
#ai{position:fixed;right:16px;bottom:16px;z-index:30;width:56px;height:56px;border-radius:50%;border:0;background:var(--grad);color:#0A0A0F;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 24px rgba(255,107,0,.6);animation:glowp 2.6s ease-in-out infinite}
#ai .ic{width:26px;height:26px}

["gheymeh","خورش قیمه","ناهار","🍛",20,110,4,"متوسط","خورش سنتی با گوشت، لپه و لیمو عمانی، کنار برنج و سیب‌زمینی سرخ‌شده.","گوشت خورشتی:400:گرم|لپه:150:گرم|پیاز:2:عدد|رب گوجه:2:قاشق غذاخوری|لیمو عمانی:3:عدد|سیب‌زمینی:3:عدد","پیاز را تفت دهید، گوشت را اضافه کنید و ۱۵ دقیقه سرخ کنید.|رب گوجه را ۲ دقیقه تفت دهید و لپه و لیمو عمانی سوراخ‌شده را اضافه کنید.|آب بریزید و ۷۵ دقیقه با حرارت کم بپزید.|سیب‌زمینی‌ها را خلال و سرخ کنید و روی خورش بچینید.","لپه را نیم‌پز کنید تا خورش زودتر جا بیفتد و لپه له نشود.",""],
["adaspolo","عدس‌پلو","ناهار","🍚",15,65,4,"متوسط","پلوی خوش‌عطر با عدس، کشمش و پیازداغ.","برنج:400:گرم|عدس:150:گرم|پیاز:2:عدد|کشمش:50:گرم|زعفران:1:قاشق چای‌خوری","عدس را ۱۵ دقیقه بپزید تا نیم‌پز شود و آبکش کنید.|پیاز را حلقه کنید و ۱۰ دقیقه تفت دهید تا طلایی شود؛ کشمش را در آخر اضافه کنید.|برنج را نیم‌پز و آبکش کنید و لایه‌لایه با عدس در قابلمه بریزید.|قابلمه را با دمکنی روی حرارت کم ۴۰ دقیقه دم بگذارید و زعفران دم‌کرده را روی آن بپاشید.","پیاز را طلایی تفت بدهید، نه سوخته؛ شیرینی‌اش با کشمش می‌آمیزد.",""],
["lobiapolo","لوبیاپلو","ناهار","🍚",20,60,4,"متوسط","پلوی لوبیاسبز و گوشت با رب گوجه؛ ناهار جمعه.","برنج:400:گرم|لوبیا سبز:300:گرم|گوشت چرخ‌کرده:300:گرم|رب گوجه:2:قاشق غذاخوری|پیاز:1:عدد","پیاز و گوشت را ۱۰ دقیقه سرخ کنید، رب گوجه را اضافه کنید و ۲ دقیقه تفت دهید.|لوبیا سبز را خرد کنید، به گوشت اضافه کنید و ۱۵ دقیقه با کمی آب بپزید.|برنج را نیم‌پز و آبکش کنید و لایه‌لایه با مخلوط لوبیا در قابلمه بریزید.|با حرارت کم ۴۰ دقیقه دم بگذارید.","لوبیا را ریز خرد کنید تا در پلو یکدست پخش شود.",""],
["teahchin","ته‌چین مرغ","ناهار","🍗",30,90,6,"متوسط","برنج زعفرانی با ماست و مرغ و ته‌دیگ طلایی.","برنج:500:گرم|مرغ:500:گرم|ماست:300:گرم|تخم‌مرغ:2:عدد|پیاز:1:عدد|زعفران:1:قاشق چای‌خوری","مرغ و پیاز را ۳۰ دقیقه بپزید و ریش‌ریش کنید.|برنج را نیم‌پز و آبکش کنید.|ماست، تخم‌مرغ و زعفران دم‌کرده را مخلوط کنید و برنج را در آن بریزید.|نصف برنج را در قابلمه بریزید، مرغ را پخش کنید و بقیه‌ی برنج را روی آن بگذارید.|۶۰ دقیقه در فر ۱۸۰ درجه بپزید تا ته‌اش طلایی شود.","قابلمه‌ی ته‌چین را قبل از برگرداندن ۵ دقیقه استراحت بدهید تا راحت‌تر جدا شود.",""],
["joojeh","جوجه‌کباب تابه‌ای","شام","🍢",45,20,3,"آسان","مرغ ماست‌وزعفرانی که در تابه هم آبدار و خوش‌رنگ می‌شود.","مرغ:600:گرم|پیاز:2:عدد|ماست:150:گرم|زعفران:1:قاشق چای‌خوری|گوجه:2:عدد","مرغ را تکه‌تکه کنید و با پیاز رنده‌شده، ماست و زعفران دم‌کرده مخلوط کنید.|مرغ را حداقل ۳۰ دقیقه در یخچال بگذارید تا طعم بگیرد.|تابه‌ی سنگین را داغ کنید و مرغ را هر طرف ۷ دقیقه بپزید.|گوجه‌ها را کنارش بگذارید و ۵ دقیقه تفت دهید.","تابه را خوب داغ کنید تا مرغ آبش را نگه دارد.",""],
["morghghareh","مرغ و قارچ خامه‌ای","شام","🍄",10,30,3,"آسان","مرغ آبدار در سس خامه و قارچ؛ شامی مهمانی‌پسند.","مرغ:500:گرم|قارچ:250:گرم|خامه:150:میلی‌لیتر|پیاز:1:عدد|سیر:2:حبه","مرغ را تکه‌تکه کنید و با پیاز ۸ دقیقه در تابه سرخ کنید تا طلایی شود.|قارچ و سیر را اضافه کنید و ۶ دقیقه تفت دهید.|خامه را بریزید و ۱۰ دقیقه با حرارت ملایم بپزید تا سس غلیظ شود.","خامه را با حرارت ملایم اضافه کنید تا نبُرد.",""],
["mahi","ماهی سرخ‌شده","شام","🐟",15,12,3,"آسان","ماهی ترد و طلایی با سیر و آبلیمو.","ماهی:4:تکه|آرد:3:قاشق غذاخوری|سیر:2:حبه|آبلیمو:2:قاشق غذاخوری","ماهی را با سیر رنده‌شده، نمک و آبلیمو ۱۵ دقیقه بخوابانید.|تکه‌ها را در آرد بغلتانید.|در روغن داغ هر طرف ۴ دقیقه سرخ کنید تا طلایی و ترد شود.","ماهی را قبل از آرد‌زدن خشک کنید تا روغن نپاشد.",""],
["koofteh","کوفته‌برنجی","شام","🍲",30,60,4,"متوسط","کوفته‌های درشت با برنج و سبزی در سس گوجه.","گوشت چرخ‌کرده:400:گرم|برنج:100:گرم|سبزی معطر:150:گرم|گوجه:3:عدد|پیاز:2:عدد","برنج را نیم‌پز کنید و با گوشت، سبزی و پیاز رنده‌شده خوب ورز دهید.|از مایه گوله‌های بزرگ بسازید.|گوجه‌ها و کمی پیاز را تفت دهید و با ۳ لیوان آب سس درست کنید.|کوفته‌ها را در سس بگذارید و ۴۵ دقیقه با حرارت کم و بدون هم‌زدن بپزید.","کوفته‌ها را هم نزنید؛ فقط قابلمه را آرام تکان بدهید تا نپاشند.",""],
["halva","حلوا","شیرینی","🍯",5,20,6,"آسان","حلوای زعفرانی با آرد برشته و گلاب.","آرد:200:گرم|شکر:150:گرم|روغن:100:میلی‌لیتر|گلاب:2:قاشق غذاخوری|زعفران:1:قاشق چای‌خوری","آرد را در روغن روی حرارت ملایم ۱۲ دقیقه هم بزنید تا طلایی شود.|شکر را با ۲ لیوان آب و زعفران جوش بیاورید و گلاب را اضافه کنید.|شربت را کم‌کم روی آرد بریزید و ۵ دقیقه هم بزنید تا غلیظ شود.","شربت را با احتیاط اضافه کنید؛ آرد برشته‌شده هنگام ریختن می‌پاشد.",""],
["ferni","فرنی","شیرینی","🥛",5,20,4,"آسان","دسر شیری و خنک با آرد برنج و گلاب.","شیر:750:میلی‌لیتر|آرد برنج:60:گرم|شکر:80:گرم|گلاب:1:قاشق غذاخوری","آرد برنج را با کمی شیر سرد صاف کنید.|بقیه‌ی شیر را گرم کنید، مخلوط را اضافه کنید و ۱۵ دقیقه هم بزنید تا غلیظ شود.|شکر و گلاب را اضافه کنید، در کاسه بریزید و سرد کنید.","مدام هم بزنید تا گلوله نشود و ته نگیرد.",""],
["yazdicake","کیک یزدی","شیرینی","🧁",15,25,8,"متوسط","کیک کاپی و معطر با هل، مناسب چای عصرانه.","آرد:300:گرم|شکر:200:گرم|تخم‌مرغ:4:عدد|شیر:150:میلی‌لیتر|روغن:100:میلی‌لیتر|هل:1:قاشق چای‌خوری","تخم‌مرغ و شکر را ۵ دقیقه با همزن بزنید تا کرمی و پرحجم شود.|روغن، شیر و هل را اضافه کنید و هم بزنید.|آرد الک‌شده را کم‌کم اضافه کنید و مایه را در قالب کاپ‌کیک بریزید.|در فر ۱۸۰ درجه ۲۵ دقیقه بپزید.","تخم‌مرغ‌ها را خوب هم بزنید؛ حجم کیک از همین مرحله می‌آید.",""],
["hotchoc","شکلات داغ","شیرینی","☕",3,7,2,"آسان","شکلات داغ غلیظ و سریع برای روزهای سرد.","شیر:400:میلی‌لیتر|کاکائو:30:گرم|شکر:40:گرم","کاکائو و شکر را با کمی شیر سرد مخلوط کنید تا صاف شود.|بقیه‌ی شیر را اضافه کنید و ۶ دقیقه روی حرارت ملایم گرم کنید و هم بزنید.|قبل از جوش‌آمدن در لیوان بریزید.","یک ذره نمک، طعم شکلات را کامل‌تر می‌کند.",""],
["ashreshteh","آش رشته","گیاهی","🍜",20,85,5,"متوسط","آش غلیظ با حبوبات، سبزی و رشته.","رشته آش:150:گرم|سبزی آش:300:گرم|نخود:100:گرم|لوبیا قرمز:100:گرم|عدس:100:گرم|پیاز:2:عدد","نخود و لوبیا را با ۸ لیوان آب ۴۰ دقیقه بپزید.|عدس را اضافه کنید و ۱۵ دقیقه دیگر بپزید.|سبزی خرد‌شده را اضافه کنید و ۱۵ دقیقه بپزید.|رشته را اضافه کنید و ۱۵ دقیقه بپزید و مرتب هم بزنید تا نچسبد.|پیاز را جداگانه تفت دهید و روی آش بریزید.","نخود و لوبیا را از شب قبل خیس کنید و رشته را آخر اضافه کنید تا له نشود.",""],
["kashkbademjan","کشک بادمجان","گیاهی","🍆",15,30,3,"آسان","بادمجان سرخ‌شده با کشک، پیازداغ و گردو.","بادمجان:4:عدد|کشک:100:گرم|پیاز:2:عدد|سیر:3:حبه|گردو:40:گرم","بادمجان‌ها را پوست بگیرید، طولی برش بزنید و سرخ کنید.|پیاز را حلقه کنید و ۱۰ دقیقه تفت دهید؛ سیر را در آخر اضافه کنید.|بادمجان را با کمی آب ۱۰ دقیقه بپزید و له کنید.|کشک را کم‌کم اضافه کنید و ۵ دقیقه بپزید.|با پیازداغ و گردو تزیین کنید.","بادمجان را در نمک‌آب بخوابانید تا تلخی‌اش برود.",""],
["saladshirazi","سالاد شیرازی","گیاهی","🥒",10,0,3,"آسان","سالاد خنک و ترش با خیار، گوجه و پیاز.","خیار:3:عدد|گوجه:3:عدد|پیاز:1:عدد|آبلیمو:2:قاشق غذاخوری","خیار، گوجه و پیاز را ریز و هم‌اندازه خرد کنید.|در کاسه بریزید و آبلیمو، نمک و کمی نعناع خشک اضافه کنید.|مخلوط کنید و ۱۰ دقیقه در یخچال بگذارید تا طعم‌ها جا بیفتد.","سالاد را نزدیک سرو‌کردن مخلوط کنید تا آب نیندازد.",""],
["kookukadoo","کوکو کدو","گیاهی","🥒",15,20,3,"آسان","کوکوی سبک و آبدار با کدوی رنده‌شده.","کدو:3:عدد|تخم‌مرغ:3:عدد|پیاز:1:عدد|آرد:2:قاشق غذاخوری","کدوها را رنده کنید و آب‌شان را خوب بگیرید.|با پیاز رنده‌شده، تخم‌مرغ و آرد مخلوط کنید.|در تابه‌ی چرب هر طرف ۱۰ دقیقه با حرارت ملایم بپزید.","آب کدو را کامل بگیرید تا کوکو در وسط خام نماند.",""],
["soupjo","سوپ جو","گیاهی","🥣",10,60,4,"آسان","سوپ گرم و سیرکننده با جو، سبزیجات و شیر.","جو پرک:100:گرم|هویج:2:عدد|پیاز:1:عدد|سیب‌زمینی:2:عدد|شیر:200:میلی‌لیتر","جو را بشویید و با ۸ لیوان آب ۴۰ دقیقه بپزید.|پیاز را تفت دهید و با هویج و سیب‌زمینی خرد‌شده به سوپ اضافه کنید.|۲۰ دقیقه دیگر بپزید، شیر را اضافه کنید و ۵ دقیقه بجوشانید.","شیر را در آخر اضافه کنید تا سوپ نبُرد.",""],
["lobiakhorak","خوراک لوبیا","گیاهی","🫘",15,60,4,"آسان","لوبیای سفید در سس گوجه و سیر.","لوبیا سفید:300:گرم|گوجه:3:عدد|پیاز:1:عدد|سیر:3:حبه|رب گوجه:1:قاشق غذاخوری","لوبیا را ۴۵ دقیقه بپزید تا نرم شود.|پیاز و سیر را تفت دهید، رب و گوجه‌ی رنده‌شده را اضافه کنید و ۸ دقیقه بپزید.|لوبیا را به سس اضافه کنید و ۱۰ دقیقه با حرارت ملایم بجوشانید.","لوبیا را از شب قبل خیس کنید تا زودتر و یکدست بپزد.",""],
["nugget","ناگت مرغ","فست‌فود","🍗",20,15,3,"آسان","ناگت خانگی ترد با پودر سوخاری.","مرغ:500:گرم|آرد:60:گرم|تخم‌مرغ:2:عدد|پودر سوخاری:100:گرم","مرغ را به تکه‌های کوچک ببُرید و با نمک و ادویه مزه‌دار کنید.|هر تکه را در آرد، بعد تخم‌مرغ و آخر پودر سوخاری بغلتانید.|در روغن داغ هر طرف ۴ دقیقه سرخ کنید تا طلایی شود.|روی دستمال کاغذی بگذارید تا روغنش کشیده شود.","روغن را داغ نگه دارید؛ روغن ولرم، سوخاری را چرب و نرم می‌کند.",""],
["hotdog","هات‌داگ خانگی","فست‌فود","🌭",10,8,2,"آسان","هات‌داگ سریع با خیارشور و گوجه.","سوسیس:4:عدد|نان:2:عدد|خیارشور:2:عدد|گوجه:1:عدد","سوسیس‌ها را ۵ دقیقه در تابه بپزید تا طلایی شوند.|نان را از وسط برش بزنید و ۱ دقیقه در تابه گرم کنید.|سوسیس، خیارشور و گوجه را داخل نان بگذارید.","روی سوسیس چند برش سطحی بزنید تا یکنواخت‌تر بپزد.",""],
["eggsandwich","ساندویچ تخم‌مرغ و پنیر","فست‌فود","🥪",5,8,2,"آسان","ساندویچ صبحانه‌ای گرم و سیرکننده.","نان:2:عدد|تخم‌مرغ:3:عدد|پنیر:40:گرم|گوجه:1:عدد","تخم‌مرغ‌ها را بزنید و در تابه ۴ دقیقه بپزید تا سفت شود.|پنیر را روی تخم‌مرغ بگذارید و ۱ دقیقه صبر کنید تا آب شود.|نان را گرم کنید و تخم‌مرغ و گوجه را داخلش بگذارید.","تخم‌مرغ را با حرارت متوسط بپزید تا لاستیکی نشود.",""],
["garlicbread","نان سیر","فست‌فود","🥖",5,10,3,"آسان","نان برشته با کره‌ی سیر و پنیر ذوب‌شده.","نان:2:عدد|کره:40:گرم|سیر:3:حبه|پنیر:60:گرم","کره‌ی نرم را با سیر رنده‌شده مخلوط کنید.|روی نان‌ها بمالید و پنیر را روی آن‌ها بریزید.|در فر ۲۰۰ درجه ۱۰ دقیقه بپزید تا پنیر طلایی شود.","کره را نرم اما نه آب‌شده استفاده کنید تا راحت پخش شود.",""],

};
/* جدول تبدیل واحد (گرم/میلی‌لیتر تقریبی) */
const UNIT={"قاشق غذاخوری":15,"قاشق چای‌خوری":5,"پیمانه":200,"لیوان":200,"کیلوگرم":1000};
/* ----- پاسخ‌دهی محلی: بدون اینترنت و بدون کلید API ----- */
function localAnswer(t,cur){
 const nt=norm(t);
 /* ۱) تنظیم تعداد نفرات همین دستور (وصل به صفحه‌ی دستور) */
 const mServ=t.match(/(?:برای|به)\s*([۰-۹0-9]+)\s*نفر/);
 if(mServ&&cur){
  const n=+faToEn(mServ[1]);
  if(n>0&&n<100){applyM(n/cur.s);return `مواد و مقدارهای «${cur.t}» برای ${fa(n)} نفر تنظیم شد ✅ (دستور پایه برای ${fa(cur.s)} نفر بود). می‌تونی روی صفحه ببینی‌شون.`}
 }
 /* ۲) جایگزین یک ماده */
 const mSub=t.match(/جایگزین\s+([\u0600-\u06FF‌]+)/);
 if(mSub){
  const key=Object.keys(SUBS).find(k=>norm(k)==norm(mSub[1])||norm(mSub[1]).includes(norm(k))||norm(k).includes(norm(mSub[1])));
  if(key)return `جایگزین ${key}: ${SUBS[key]} 👌`;
 }
 /* ۳) تبدیل واحد */
 const mUnit=t.match(/([۰-۹0-9.]+)\s*(قاشق غذاخوری|قاشق چای‌خوری|پیمانه|لیوان|کیلوگرم)/);
 if(mUnit){
  const n=+faToEn(mUnit[1]),u=mUnit[2],g=UNIT[u]*n;
  return `${fa(n)} ${u} تقریباً برابر ${fa(Math.round(g))} گرم (برای مایعات: میلی‌لیتر) است.`;
 }
 /* ۴) برنامه‌ی غذایی هفتگی */
 if(/برنامه.*هفتگ|هفتگی.*برنامه|منوی هفته/.test(nt.replace(/‌/g," "))||/برنامه.{0,4}هفتگی/.test(t)){
  const days=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنج‌شنبه","جمعه"];
  const pick=c=>{const L=RS.filter(r=>r.c==c);return L[Math.floor(Math.random()*L.length)]};
  return "برنامه‌ی پیشنهادی یک هفته:\n"+days.map(d=>{const b=pick("صبحانه"),l=pick("ناهار"),s=pick("شام");return `${d}: صبحانه ${b.e}${b.t} · ناهار ${l.e}${l.t} · شام ${s.e}${s.t}`}).join("\n");
 }
 /* ۵) کنترل هزینه / پیشنهاد اقتصادی */
 if(/ارزان|اقتصادی|بودجه|کم‌هزینه|کم هزینه/.test(t)){
  const cheap=[...RS].sort((a,b)=>a.ing.length-b.ing.length).slice(0,4);
  return "چند پیشنهاد اقتصادی با کمترین تعداد مواد لازم:\n"+cheap.map(r=>`• ${r.e} ${r.t} (${fa(r.ing.length)} ماده، ${fa(r.p+r.k)} دقیقه)`).join("\n");
 }
 /* ۶) پیشنهاد غذا با مواد موجود که کاربر توی پیام نام برده */
 if(/چی\s*(بپزم|درست کنم)|دارم/.test(t)){
  const found=ALLI.filter(n=>t.includes(n));
  if(found.length){
   const G=RS.filter(r=>found.some(n=>r.ing.some(i=>i[0]==n)));
   if(G.length)return `با ${found.join("، ")} می‌تونی این‌ها رو درست کنی: `+G.slice(0,4).map(r=>`${r.e} ${r.t}`).join("، ")+`.\nبرای تطابق دقیق‌تر با همه‌ی موادی که داری، سراغ «تو خونه چی داری؟» برو.`;
  }
 }
 return null;
}
const panel=document.createElement("div");
panel.id="ap";panel.hidden=true;panel.setAttribute("role","dialog");panel.setAttribute("aria-label","دستیار چاشنی");
panel.innerHTML=`<div class="ah"><span>🍳 دستیار چاشنی</span><button type="button" id="ax" aria-label="بستن">✕</button></div>
<div id="am" aria-live="polite"></div>
<div class="qs"></div>
<div class="af"><input id="ai-in" placeholder="سؤال آشپزی‌ات را بنویس..." aria-label="پیام"><button type="button" class="btn" id="as" aria-label="ارسال">${I.send}</button></div>`;
const fab=document.createElement("button");
fab.id="ai";fab.type="button";fab.setAttribute("aria-label","باز کردن دستیار هوشمند");fab.setAttribute("aria-expanded","false");fab.innerHTML=I.chat;
document.body.append(panel,fab);
const say=(t,c)=>{const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("#am").append(d);$("#am").scrollTop=1e5;return d};
function refreshQS(){
 const cur=location.hash.startsWith("#/r/")?RS.find(r=>r.id==location.hash.split("/")[2]):null;
 const base=["جایگزین تخم‌مرغ چیه؟","برنامه‌ی هفتگی پیشنهاد بده","پیشنهاد اقتصادی چیه؟","۲ قاشق غذاخوری چند گرمه؟"];
 const list=cur?[`این غذا رو برای ۶ نفر تنظیم کن`,...base]:base;
 const qs=panel.querySelector(".qs");if(qs)qs.innerHTML=list.map(q=>`<button type="button" class="chip">${q}</button>`).join("");
}
function aiToggle(open){
 panel.hidden=!open;fab.setAttribute("aria-expanded",open);
 if(open){refreshQS();if(!$("#am").children.length)say("سلام! من دستیار چاشنی‌ام 🍳 می‌تونم مواد جایگزین پیشنهاد بدم، واحدها رو تبدیل کنم، برنامه‌ی هفتگی بسازم یا تعداد نفرات همین دستور رو برات عوض کنم. بپرس!","a");$("#ai-in").focus()}
}
async function send(t){
 t=t.trim();if(!t||busy)return;busy=true;$("#ai-in").value="";
 say(t,"u");hist.push({role:"user",content:t});
 const cur=location.hash.startsWith("#/r/")?RS.find(r=>r.id==location.hash.split("/")[2]):null;
 const local=localAnswer(t,cur);
 if(local){hist.push({role:"assistant",content:local});say(local,"a");busy=false;return}
 if(!AI.url){
  say("این سؤال به هوش آزادتری نیاز داره که فعلاً به سرویس هوش مصنوعی وصل نیست (برای امنیت، هیچ کلیدی داخل این صفحه نگه‌داری نمی‌شود). فعلاً می‌تونم کمک کنم با: جایگزین مواد، تبدیل واحد، برنامه‌ی هفتگی، پیشنهاد اقتصادی، یا نوشتن «برای N نفر تنظیم کن» روی صفحه‌ی یک دستور 🍳","a");
  busy=false;return;
 }
 const w=say("…","a");
 const sys="تو «دستیار چاشنی»، دستیار آشپزی فارسی‌زبانِ سایت چاشنی هستی. کوتاه، دوستانه و کاربردی جواب بده (حداکثر حدود ۱۲۰ کلمه) و مقدارها را دقیق بگو. فقط درباره‌ی آشپزی، مواد، جایگزین مواد، برنامه‌ی غذایی، تبدیل واحد و خرید حرف بزن؛ سؤال نامرتبط را مؤدبانه به آشپزی برگردان. دستورهای سایت: "+RS.map(r=>r.t).join("، ")+"."+(cur?` کاربر الان صفحه‌ی «${cur.t}» را می‌بیند؛ مواد: ${cur.ing.map(i=>i.join(" ")).join("، ")}.`:"");
 try{
  const r=await fetch(AI.url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:sys,messages:hist.slice(-10)})});
  if(!r.ok)throw new Error(r.status);
  const a=(await r.json()).reply;
  hist.push({role:"assistant",content:a});w.textContent=a;
 }catch(e){
  hist.pop();
  w.textContent="اتصال به سرویس هوش مصنوعی برقرار نشد؛ بعداً دوباره امتحان کن.";
 }
 busy=false;
}
fab.onclick=()=>aiToggle(panel.hidden);
panel.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id=="ax")aiToggle(false);else if(b.id=="as")send($("#ai-in").value);else if(b.classList.contains("chip"))send(b.textContent)});
panel.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="ai-in")send(e.target.value);if(e.key=="Escape")aiToggle(false)});
route();
</script>
